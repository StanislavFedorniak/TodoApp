<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Tasks</h2>
  </div>

  @if (error()) {
    <div class="alert alert-danger" role="alert">
      {{ error() }}
    </div>
  }

  <!-- Task Creation Form -->
  <div class="card mb-4">
    <div class="card-body">
      <form [formGroup]="taskForm" (ngSubmit)="addTask()">
        <div class="row g-3">
          <div class="col-md-4">
            <label for="taskTitle" class="form-label">Title <span class="text-danger">*</span></label>
            <input
              type="text"
              id="taskTitle"
              class="form-control"
              formControlName="title"
              placeholder="What needs to be done?">
          </div>

          <div class="col-md-3">
            <label for="taskCategory" class="form-label">Category</label>
            <select id="taskCategory" class="form-select" formControlName="categoryId">
              <option [ngValue]="null">No Category</option>
              @for (category of categories(); track category.id) {
                <option [value]="category.id">{{ category.name }}</option>
              }
            </select>
          </div>

          <div class="col-md-3">
            <label for="taskDescription" class="form-label">Description (Optional)</label>
            <input
              type="text"
              id="taskDescription"
              class="form-control"
              formControlName="description"
              placeholder="Additional details">
          </div>

          <div class="col-md-2 d-flex align-items-end">
            <button
              type="submit"
              class="btn btn-primary w-100"
              [disabled]="taskForm.invalid || isSubmitting()">
              @if (isSubmitting()) {
                <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
              }
              Add Task
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Tasks List -->
  @if (loading()) {
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading tasks...</span>
      </div>
    </div>
  } @else {
    <div class="row g-3">
      @for (task of tasks(); track task.id) {
        <div class="col-12">
          <div class="card h-100" [class.border-success]="task.isCompleted">
            <div class="card-body d-flex align-items-center justify-content-between">
              <!-- Checkbox & Info -->
              <div class="d-flex align-items-center gap-3 w-100">
                <div class="form-check form-switch fs-4 mb-0">
                  <input
                    class="form-check-input mt-0"
                    type="checkbox"
                    role="switch"
                    [id]="'check-' + task.id"
                    [checked]="task.isCompleted"
                    [disabled]="trackingTaskId() === task.id"
                    (change)="toggleStatus(task)">
                </div>

                <div class="ms-2">
                  <h5 class="card-title mb-1" [class.text-decoration-line-through]="task.isCompleted" [class.text-muted]="task.isCompleted">
                    {{ task.title }}
                  </h5>
                  <p class="card-text mb-0 text-muted small">
                    @if (task.categoryId) {
                      <span class="badge bg-secondary me-2">Category ID: {{ task.categoryId }}</span>
                    }
                    {{ task.description }}
                  </p>
                </div>
              </div>

              <!-- Actions -->
              <div class="d-flex gap-2 ms-3">
                <button
                  class="btn btn-outline-danger btn-sm"
                  [disabled]="trackingTaskId() === task.id"
                  (click)="deleteTask(task.id)"
                  aria-label="Delete task">
                  @if (trackingTaskId() === task.id) {
                    <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
                  } @else {
                    Delete
                  }
                </button>
              </div>
            </div>
          </div>
        </div>
      } @empty {
        <div class="col-12 text-center text-muted py-5">
          <p class="mb-0 fs-5">No tasks found. Create one above!</p>
        </div>
      }
    </div>
  }
</div>
