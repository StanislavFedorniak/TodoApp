<div class="container mt-4" style="max-width: 520px">
  <h1 class="h3 mb-4">Account</h1>

  <section aria-labelledby="deleteAccountHeading" class="card border-danger">
    <div class="card-body">
      <h2 id="deleteAccountHeading" class="h5 text-danger">Delete account</h2>
      <p>This permanently deletes your account and all your tasks. This cannot be undone.</p>

      <div aria-live="polite">
        @if (error()) {
          <div class="alert alert-danger" role="alert">{{ error() }}</div>
        }
      </div>

      <form [formRoot]="deleteForm">
        <div class="mb-3">
          <label for="deletePassword" class="form-label">Confirm with your password</label>
          <input
            type="password"
            id="deletePassword"
            class="form-control"
            autocomplete="current-password"
            [formField]="deleteForm.password"
            [class.is-invalid]="deleteForm.password().touched() && deleteForm.password().invalid()"
            [attr.aria-invalid]="deleteForm.password().touched() && deleteForm.password().invalid()"
            [attr.aria-describedby]="deleteForm.password().touched() && deleteForm.password().invalid() ? 'deletePasswordError' : null">
          @if (deleteForm.password().touched() && deleteForm.password().invalid()) {
            <div id="deletePasswordError" class="invalid-feedback">{{ deleteForm.password().errors()[0].message }}</div>
          }
        </div>

        <button
          type="submit"
          class="btn btn-danger position-relative"
          [disabled]="deleteForm().invalid() || deleteForm().submitting()">
          @if (deleteForm().submitting()) {
            <span class="spinner-border spinner-border-sm position-absolute top-50 start-50 translate-middle" aria-hidden="true"></span>
          }
          <span [class.opacity-0]="deleteForm().submitting()">Delete my account</span>
        </button>
      </form>
    </div>
  </section>
</div>
